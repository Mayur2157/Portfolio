[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # asserts and fake credentials are the point of the self-check

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
